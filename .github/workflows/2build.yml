name: Build Qalbi PUBG APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_VERSION: '8.11.1'
      PKG: com.qalbi.pubg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager hittades inte"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare app module
        shell: bash
        run: |
          set -euo pipefail
          PKGDIR="app/src/main/java/$(printf '%s' "$PKG" | tr . /)"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ ! -f app/build.gradle ]; then
            echo "app/ saknas - skapar modulstruktur fran root-filerna"
            mkdir -p "$PKGDIR"

            for f in MainActivity.java CrosshairService.java; do
              if [ -f "$f" ]; then mv "$f" "$PKGDIR/"; fi
            done
            if [ -f AndroidManifest.xml ]; then
              mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi

            cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.qalbi.pubg'
              compileSdk 35

              defaultConfig {
                  applicationId "com.qalbi.pubg"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

          echo "--- projektstruktur ---"
          find app -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK
        shell: bash
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          if [ -x ./gradlew ]; then GC=./gradlew; else GC=gradle; fi

          $GC --no-daemon --stacktrace assembleDebug 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "=============== RIKTIGA FELET ==============="
            awk '/What went wrong:/{f=1} f{print} /^\* Try:/{if(f) exit}' "$LOG" | head -60
            echo "---------- forsta 40 raderna ----------"
            head -40 "$LOG"
            exit "$STATUS"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Qalbi-PUBG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
